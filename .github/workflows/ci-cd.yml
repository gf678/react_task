name: build pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Build on Server via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            set -e

            cd /home/myDev/task/jstask

            git pull origin main

            npm ci

            npm run build

            rm -rf /var/www/plug/*

            cp -r dist/* /var/www/plug/

            rm -rf dist
